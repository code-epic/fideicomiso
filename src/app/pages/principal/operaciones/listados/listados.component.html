                          <br>

                            <thead>
                              <tr style="border: 0px; border-bottom: 1px solid #c6c5c5; background-color: #e1e1d154; height: 35px;">
                                <th>CUENTA</th>
                                <th style="text-align: left;" >DESCRIPCION DE LA CUENTA</th>
                                <th style="text-align: center;">TOTAL</th>
                              </tr>
                            </thead>
                            <tbody>
                              <tr *ngFor="let e of lstTotales;" >
                                <td *ngIf="e.totalizadora=='1'" style="background-color: #e1e1d9;">{{ e.codigo }}</td>
                                <td *ngIf="e.totalizadora!='1'">{{ e.codigo }}</td>
                                <td *ngIf="e.totalizadora=='1'"  style="background-color: #e1e1d9;">{{ e.descripcion | uppercase }}</td>
                                <td *ngIf="e.totalizadora!='1'">{{ e.descripcion | uppercase }}</td>

                                <td *ngIf="e.totalizadora=='1'" 
                                  style="border: 0px;border-right:  
                                        1px solid  #ccc; text-align: right;
                                        background-color: #e1e1d9;
                                        font-weight: bold; color: #717b22;">
                                  {{ getMoneda(e.total) }}&nbsp;&nbsp;
                                </td>
                                <td *ngIf="e.totalizadora!='1'" style="border: 0px;border-right:  1px solid  #ccc; text-align: right;">
                                  {{ getMoneda(e.total) }}&nbsp;&nbsp;
                                </td>
                              </tr>
                            </tbody>
