<div class="row">
  <div class="col-md-12">
    <ngx-ui-loader [loaderId]="'load-cont'"></ngx-ui-loader>
    <mat-tab-group mat-stretch-tabs class="example-stretched-tabs" style="padding:10px;">



      <mat-tab>
        <ng-template mat-tab-label>
          <!-- <mat-icon class="example-tab-icon">tips_and_updates</mat-icon> -->
          &nbsp;BALANCE AL CIERRE
        </ng-template>
        <br>

        <br>
        <div class="example-large-box mat-elevation-z4">
          <div style="padding: 20px; width: 100%; margin-bottom: 0px;">

            <div class="row">
              <div class="col-md-12">
                <br>


                <div [innerHtml]="HTMLBalance"></div>


                <br>
                <br>
              </div>
            </div>

          </div>
        </div>
      </mat-tab>

      <mat-tab>
        <ng-template mat-tab-label>
          <!-- <mat-icon class="example-tab-icon">tips_and_updates</mat-icon> -->
          &nbsp;BALANCE DE COMPROBACION
        </ng-template>
        <br>
        <div class="example-large-box mat-elevation-z4">
          <div style="padding: 20px; width: 100%; margin-bottom: 0px;">

            <div class="row">
              <div class="col-md-12">
                <br>


                <div [innerHtml]="HTMLComprobacion"></div>


                <br>
                <br>
              </div>
            </div>

          </div>
        </div>

      </mat-tab>

      <mat-tab>
        <ng-template mat-tab-label>
          <!-- <mat-icon class="example-tab-icon">tips_and_updates</mat-icon> -->
          &nbsp;ESTADO DE RESULTADOS
        </ng-template>
        <br>
      </mat-tab>
      <mat-tab>
        <ng-template mat-tab-label>
          <!-- <mat-icon class="example-tab-icon">tips_and_updates</mat-icon> -->
          &nbsp;MAYOR ANALITICO
        </ng-template>
        <br>
      </mat-tab>
      <mat-tab>
        <ng-template mat-tab-label>
          <!-- <mat-icon class="example-tab-icon">tips_and_updates</mat-icon> -->
          &nbsp;AUXILIAR CONTABLE
        </ng-template>
        <br>
      </mat-tab>

    </mat-tab-group>
  </div>
</div>
