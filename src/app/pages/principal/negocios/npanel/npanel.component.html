<div class="row">
    <div class="col-md-12">
        <div class="card card-profile shadow">
            <div class="card-body">
                <ngx-ui-loader [loaderId]="'load-inver'"></ngx-ui-loader>
                <div class="row">
                    <div class="col-xl-4 col-lg-4">
                        <a routerLinkActive="active" [routerLink]="['/incrementos']">
                            <div matRipple class="card card-stats mb-4 mb-xl-0">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col">
                                            <h5 class="card-title text-uppercase text-muted mb-0">Aporte por Incremento
                                            </h5>
                                            <span class="h2 font-weight-bold mb-0">Incremento</span>
                                        </div>
                                        <div class="col-auto">
                                            <div class="icon icon-shape bg-green text-white rounded-circle shadow">
                                                <i class="fas fa-warehouse"></i>
                                            </div>
                                        </div>
                                    </div>
                                    <p class="mt-3 mb-0 text-muted text-sm">
                                        <span class="text-success mr-2"><i class="fas fa-arrow-up"></i> Stock</span>
                                        <span class="text-nowrap">en el sistema</span>
                                    </p>
                                </div>
                            </div>
                        </a>
                    </div>

                    <div class="col-xl-4 col-lg-4">
                        <a routerLinkActive="active" [routerLink]="['/retiros']">
                            <div matRipple class="card card-stats mb-4 mb-xl-0">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col">
                                            <h5 class="card-title text-uppercase text-muted mb-0">Retiros</h5>
                                            <span class="h2 font-weight-bold mb-0">Retiros</span>
                                        </div>
                                        <div class="col-auto">
                                            <div class="icon icon-shape bg-info text-white rounded-circle shadow">
                                                <i class="fas fa-truck"></i>
                                            </div>
                                        </div>
                                    </div>
                                    <p class="mt-3 mb-0 text-muted text-sm">
                                        <span class="text-danger mr-2"><i class="fas fa-arrow-down"></i>
                                            Artículos</span>
                                        <span class="text-nowrap">en el sistema</span>
                                    </p>
                                </div>
                            </div>
                        </a>
                    </div>

                    <div class="col-xl-4 col-lg-4">
                        <a routerLinkActive="active" [routerLink]="['/finiquito']">
                            <div matRipple class="card card-stats mb-4 mb-xl-0">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col">
                                            <h5 class="card-title text-uppercase text-muted mb-0">Finiquitos</h5>
                                            <span class="h2 font-weight-bold mb-0">Finiquitos</span>
                                        </div>
                                        <div class="col-auto">
                                            <div class="icon icon-shape bg-blue text-white rounded-circle shadow">
                                                <i class="fas fa-wrench"></i>
                                            </div>
                                        </div>
                                    </div>
                                    <p class="mt-3 mb-0 text-muted text-sm">
                                        <span class="text-success mr-2"><i class="fas fa-arrow-up"></i> Stock</span>
                                        <span class="text-nowrap">en el sistema</span>
                                    </p>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
                
                <br>

                <div class="row">
                    <div class="col-xl-4 col-lg-4">
                        <a routerLinkActive="active" [routerLink]="['/intereses']">
                            <div matRipple class="card card-stats mb-4 mb-xl-0">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col">
                                            <h5 class="card-title text-uppercase text-muted mb-0">Intereses</h5>
                                            <span class="h2 font-weight-bold mb-0">Intereses por Disponibilidad</span>
                                        </div>
                                        <div class="col-auto">
                                            <div class="icon icon-shape bg-danger text-white rounded-circle shadow">
                                                <i class="fas fa-percentage"></i>
                                            </div>
                                        </div>
                                    </div>
                                    <p class="mt-3 mb-0 text-muted text-sm">
                                        <span class="text-success mr-2"><i class="fas fa-calculator"></i> Cálculo y Pago</span>
                                        <span class="text-nowrap">de intereses</span>
                                    </p>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="col-xl-4 col-lg-4">
                        <a routerLinkActive="active" [routerLink]="['/pagointereses']">
                            <div matRipple class="card card-stats mb-4 mb-xl-0">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col">
                                            <h5 class="card-title text-uppercase text-muted mb-0">Rendimientos</h5>
                                            <span class="h2 font-weight-bold mb-0">Pago de Rendimientos</span>
                                        </div>
                                        <div class="col-auto">
                                            <div class="icon icon-shape bg-info text-white rounded-circle shadow">
                                                <i class="fas fa-money-bill-wave"></i>
                                            </div>
                                        </div>
                                    </div>
                                    <p class="mt-3 mb-0 text-muted text-sm">
                                        <span class="text-success mr-2"><i class="fas fa-exchange-alt"></i> Distribución</span>
                                        <span class="text-nowrap">734 / 744 → 711</span>
                                    </p>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
                <br>
            </div>
        </div>
    </div>
</div>
