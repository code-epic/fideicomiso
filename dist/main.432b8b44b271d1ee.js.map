<nav class="navbar navbar-vertical navbar-expand-md navbar-light bg-white" id="sidenav-main">
  <div class="container-fluid">

    <button class="navbar-toggler" type="button" (click)="isCollapsed=!isCollapsed"

      <span class="navbar-toggler-icon"></span>
    </button>
    <!-- Brand -->
    <a class="navbar-brand pt-0" routerLinkActive="active" [routerLink]="['/principal']">

    <div class="collapse navbar-collapse" [ngbCollapse]="isCollapsed" id="sidenav-collapse-main">

      <div class="navbar-collapse-header d-md-none">

          <div class="col-6 collapse-brand">
            <a routerLinkActive="active" [routerLink]="['/principal']">
              <img src="./assets/img/brand/red.png">
            </a>
          </div>
          <div class="col-6 collapse-close">
            <button type="button" class="navbar-toggler" (click)="isCollapsed=!isCollapsed">
              <span></span>
              <span></span>
            </button>
          </div>
        </div>
      </div>
      <!-- Form -->

      <!-- Navigation -->
      <ul class="navbar-nav">

         <li *ngFor="let menuItem of menuItems; let i = index">
          <div matRipple class="nav-item">
            <a routerLinkActive="active" [routerLink]="[menuItem.path]" class="nav-link" (click)="msj(menuItem.title)">
              <i class="ni {{ menuItem.icon + ' ' +  menuItem.class}}"></i>
              {{ menuItem.title }}
            </a>
          </div>
        </li>
        
        <!-- <li *ngFor="let menuItem of menuItems" class=" nav-item">
          <a routerLinkActive="active" [routerLink]="[menuItem.path]" class="nav-link" (click)="msj(menuItem.title)">
            <i class="ni {{ menuItem.icon + ' ' +  menuItem.class}}"></i>
            {{menuItem.title}}
          </a>
        </li> -->
      </ul>
      <!-- Divider -->
      <hr class="my-3">
      <!-- Heading -->
      <h6 class="navbar-heading text-muted">Documentación</h6>
      <!-- Navigation -->
      <ul class="navbar-nav mb-md-3">
        <li class="nav-item">
          <a class="nav-link" href="#">
            <i class="ni ni-spaceship"></i> Comenzar
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="https://code-epic.github.io">
            <i class="ni ni-palette"></i> Sobre Code Epic
          </a>
        </li>
      </ul>

      <hr class="my-3">

        <li class="nav-item">
          <span class="nav-link">

        </li>
        <li class="nav-item">
